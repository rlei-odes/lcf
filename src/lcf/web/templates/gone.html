{% extends "base.html" %}
{% block title %}Not here{% endblock %}
{% block subtitle %}<a href="/doc-types">document types</a>{% endblock %}

{% block content %}
<div class="card">
  <h2>That is not here</h2>
  <p class="lead">{{ message }}</p>

  <div class="actions">
    <a href="/doc-types"><button class="primary" type="button">Document types</button></a>
    <a href="/"><button type="button">All documents</button></a>
  </div>
</div>
{% endblock %}
