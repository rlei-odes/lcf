[project]
name = "lcf"
version = "0.2.0"
description = "Lancy Content Flow — LLM-guided creation of rule-bound documents"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "ruamel.yaml>=0.18",
    "boto3>=1.35",
    "docxtpl>=0.17",
    "python-docx>=1.1",
    "markdown-it-py>=3.0",
    "loguru>=0.7",
    "openai>=1.54",
    # The evidence desk's ingest path. Every one of these resolves from a wheel at
    # install time and fetches nothing at runtime, which is the test docs/EVIDENCE-DESK.md
    # §4.2 sets and the reason `docling` is an extra rather than a dependency.
    # The `crypto` extra is `cryptography`, and it is not optional in practice:
    # a PDF off a customer portal or a scanner is routinely AES-encrypted with an
    # empty user password — it opens with a double-click, and without this pypdf
    # raises on the first object it has to decrypt.
    "pypdf[crypto]>=5.1",
    "pillow>=11.0",
    "mail-parser-reply>=1.3",
    "regex>=2024.11",
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    "py3langid>=0.3",
]

[project.scripts]
lcf = "lcf.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

# `docling` is deliberately NOT an extra here, though it is the obvious place for
# one. uv resolves every extra into a single universal lock, so declaring it made
# docling's constraints move versions for installations that will never install
# it — it downgraded `websockets`, which uvicorn uses, on every deployment.
#
# An optional capability must not be able to do that. So the evidence desk
# imports it lazily behind `ingest/docling_backend.available()` and an
# installation that wants layout-aware parsing or OCR adds it to the same
# environment itself:
#
#     uv pip install docling
#
# See docs/EVIDENCE-DESK.md §4.2 for why it is not the default parser.

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Alembic writes these; they are a record of what ran, not code we style.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# "." as well as "src": seven modules import helpers from tests.conftest, and the
# repo root is only on sys.path implicitly when pytest is started as
# `python -m pytest`. Without it, a plain `pytest` — which is what `uv run pytest`
# and most CI recipes do — fails at collection.
pythonpath = ["src", "."]
