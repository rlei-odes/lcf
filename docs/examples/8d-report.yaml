# 8D Report — document type specification
#
# Worked example for docs/DESIGN.md §4. This is the first real-world target and
# doubles as the test fixture for the engine: the state machine, dependency
# gating and every deterministic check must be exercisable against this file
# with hand-written content and no LLM at all.

id: 8d-report
version: 1
title: 8D Report
description: >
  Eight-disciplines problem solving report for a customer complaint or internal
  nonconformity. Documents the team, the problem, containment, root cause,
  corrective and preventive action, and closure.
language: en
template: 8d-report-v1.docx

style: >
  Formal register, customer-facing. Past tense for what happened, present tense
  for what is in place now. Explain internal abbreviations, machine names and
  system names on first use — the reader is a quality engineer at the customer
  with no knowledge of our plant. Never speculate: if something is suspected
  rather than established, say so explicitly or leave it out.

# ---------------------------------------------------------------------------
# Sections
# ---------------------------------------------------------------------------
sections:

  - key: header
    title: "Report Header"
    description: "Identifying data for the report and the complaint it answers."
    guidance: >
      Extract from the customer complaint, claim document or internal
      nonconformity record. Do not guess part or claim numbers — if they are not
      in the evidence, ask.
    required: true
    depends_on: []
    questions:
      - key: complaint_source
        prompt: "Where did this complaint come from?"
        type: choice
        options: [customer_claim, internal_nonconformity, field_return, audit_finding]
        required: true
      - key: escalated_from
        prompt: "Was this escalated from an existing 4D report? If so, which one?"
        type: text
        required: false
    blocks:
      - key: meta
        kind: keyvalue
        label: "Report data"
        fields:
          - { key: report_no,    label: "Report number",  type: string, required: true }
          - { key: customer,     label: "Customer",       type: string, required: true }
          - { key: claim_no,     label: "Claim number",   type: string, required: false }
          - { key: part_no,      label: "Part number",    type: string, required: true }
          - { key: part_name,    label: "Part name",      type: string, required: true }
          - { key: quantity,     label: "Quantity affected", type: number, required: true }
          - { key: opened_at,    label: "Date opened",    type: date,   required: true }
    requirements:
      - id: header_complete
        kind: present
        block: meta
        severity: blocker
      - id: header_date_valid
        kind: format
        block: meta
        field: opened_at
        format: date
        severity: blocker

  - key: d1_team
    title: "D1 — Establish the Team"
    description: "The cross-functional team responsible for this 8D, with roles."
    guidance: >
      An 8D team needs a champion and members covering the affected process,
      quality and — where the defect reached the customer — the customer
      interface. Propose roles from the evidence; ask for names.
    required: true
    depends_on: [header]
    questions:
      - key: members_raw
        prompt: "Who is on the team? Name, role and function for each person."
        type: text
        required: true
        hint: "One per line is fine. Mark the champion."
    blocks:
      - key: members
        kind: table
        label: "Team members"
        columns:
          - { key: name,       label: "Name",       type: string }
          - { key: role,       label: "Role",       type: string }
          - { key: function,   label: "Function",   type: string }
          - { key: is_champion, label: "Champion",  type: boolean }
        min_rows: 2
    requirements:
      - id: team_min_size
        kind: rows
        block: members
        min: 2
        severity: blocker
      - id: team_fields_filled
        kind: fields_filled
        block: members
        fields: [name, role, function]
        severity: blocker
      - id: team_has_champion
        kind: rubric
        block: members
        rubric: "Exactly one team member is marked as champion."
        severity: blocker

  - key: d2_problem
    title: "D2 — Describe the Problem"
    description: >
      The problem in measurable terms: what, where, when, how many, and how it
      was detected. This is the section every later discipline refers back to.
    guidance: >
      Aim for a description a reader outside the plant can act on. Quantify.
      Distinguish clearly between what is *observed* and what is *suspected* —
      suspicion belongs in D4, not here.
    required: true
    depends_on: [header]
    uses_images: true
    style: >
      Strictly factual. Describe only what was observed or measured.
    questions:
      - key: what_is_wrong
        prompt: "What is wrong with the part, stated as objectively as you can?"
        type: text
        required: true
      - key: first_observed
        prompt: "When was the problem first observed?"
        type: date
        required: true
      - key: quantity_affected
        prompt: "How many parts are affected, and out of what total?"
        type: text
        required: true
      - key: where_occurred
        prompt: "Where did it occur — which process step, line, or in the field?"
        type: text
        required: true
      - key: how_detected
        prompt: "How was it detected, and by whom?"
        type: text
        required: true
    blocks:
      - key: description
        kind: prose
        label: "Problem description"
        hint: "What is wrong, stated objectively and measurably."
      - key: is_is_not
        kind: table
        label: "Is / Is not analysis"
        columns:
          - { key: dimension, label: "Dimension", type: string }
          - { key: is,        label: "Is",        type: string }
          - { key: is_not,    label: "Is not",    type: string }
        min_rows: 3
      - key: detection
        kind: prose
        label: "How the problem was detected"
      - key: photos
        kind: image_ref
        label: "Defect photographs"
        multiple: true
        required: false
    requirements:
      - id: problem_present
        kind: present
        block: description
        severity: blocker
      - id: problem_substantial
        kind: length
        block: description
        min_words: 40
        severity: warning
      - id: problem_quantified
        kind: mentions
        block: description
        must_mention:
          - "the quantity or rate of affected parts"
          - "when the problem was first observed"
          - "where in the process or field it occurred"
        severity: blocker
      - id: is_is_not_filled
        kind: rows
        block: is_is_not
        min: 3
        severity: warning
      - id: detection_present
        kind: present
        block: detection
        severity: blocker

  - key: d3_containment
    title: "D3 — Interim Containment Actions"
    description: >
      Immediate actions protecting the customer until a permanent fix is
      verified — sorting, blocking stock, 100% inspection, customer notification.
    guidance: >
      Containment is about protection, not correction. Every action needs an
      owner, a date and a verified effectiveness statement. Actions without a
      date are not containment.
    required: true
    depends_on: [d2_problem]
    questions:
      - key: actions_taken
        prompt: "What has been done to protect the customer? Include owner and date for each."
        type: text
        required: true
      - key: stock_disposition
        prompt: "What happened to stock already at the customer or in transit?"
        type: text
        required: true
        hint: "Sorted, blocked, recalled, or accepted with concession."
      - key: customer_informed
        prompt: "Was the customer formally notified?"
        type: boolean
        required: true
      - key: containment_effective
        prompt: "How do you know the containment is working?"
        type: text
        required: true
    blocks:
      - key: actions
        kind: table
        label: "Containment actions"
        columns:
          - { key: action,        label: "Action",        type: string }
          - { key: owner,         label: "Owner",         type: string }
          - { key: implemented_at, label: "Implemented",  type: date }
          - { key: effectiveness, label: "Effectiveness verified", type: string }
        min_rows: 1
      - key: scope
        kind: prose
        label: "Scope of containment"
        hint: "Stock in transit, customer stock, finished goods, WIP, field units."
    requirements:
      - id: containment_present
        kind: rows
        block: actions
        min: 1
        severity: blocker
      - id: containment_owned_and_dated
        kind: fields_filled
        block: actions
        fields: [action, owner, implemented_at]
        severity: blocker
      - id: containment_dates_valid
        kind: format
        block: actions
        field: implemented_at
        format: date
        severity: blocker
      - id: containment_covers_stock
        kind: mentions
        block: scope
        must_mention:
          - "what happens to stock already at the customer or in transit"
        severity: blocker

  - key: d4_root_cause
    title: "D4 — Root Cause Analysis"
    description: >
      The verified root cause of occurrence and the root cause of non-detection.
      Both are required: something made the defect, something let it escape.
    guidance: >
      Drive each cause to a systemic level — a 5-Why that ends at "operator
      error" has stopped too early; ask what allowed the error. Never state a
      root cause the evidence does not support: emit a gap instead.
    required: true
    depends_on: [d2_problem]
    questions:
      - key: suspected_cause
        prompt: "What do you believe caused the defect, and what evidence supports that?"
        type: text
        required: true
      - key: cause_verified
        prompt: "Has the cause been verified — reproduced, measured, or confirmed?"
        type: boolean
        required: true
      - key: escape_cause
        prompt: "Why did existing controls not catch it before it reached the customer?"
        type: text
        required: true
      - key: ruled_out
        prompt: "What else did you consider and rule out?"
        type: text
        required: false
    blocks:
      - key: causes
        kind: table
        label: "Identified causes"
        columns:
          - { key: id,       label: "ID",   type: string }
          - { key: cause,    label: "Cause", type: string }
          - { key: type,     label: "Type", type: enum, values: [occurrence, detection] }
          - { key: verified, label: "Verification method", type: string }
        min_rows: 2
      - key: five_why
        kind: table
        label: "5-Why chain"
        columns:
          - { key: level, label: "Level",  type: number }
          - { key: why,   label: "Why?",   type: string }
          - { key: answer, label: "Because", type: string }
        min_rows: 3
      - key: rejected
        kind: list
        label: "Causes considered and ruled out"
        required: false
    requirements:
      - id: root_cause_present
        kind: rows
        block: causes
        min: 2
        severity: blocker
      - id: root_cause_verified
        kind: fields_filled
        block: causes
        fields: [cause, type, verified]
        severity: blocker
      - id: both_cause_types
        kind: rubric
        block: causes
        rubric: >
          At least one cause of type "occurrence" and at least one of type
          "detection" are present.
        severity: blocker
      - id: five_why_depth
        kind: rows
        block: five_why
        min: 3
        severity: warning
      - id: five_why_systemic
        kind: rubric
        block: five_why
        rubric: >
          The final level of the 5-Why chain identifies a systemic cause — a
          process, specification, or control failure — rather than terminating
          at individual human error.
        severity: warning

  - key: d5_corrective
    title: "D5 — Chosen Permanent Corrective Actions"
    description: "The permanent actions selected to eliminate the root causes, with justification."
    guidance: >
      Every corrective action must trace to a cause ID from D4. If an action
      addresses nothing in D4, either D4 is incomplete or the action does not
      belong here.
    required: true
    depends_on: [d4_root_cause]
    questions:
      - key: chosen_actions
        prompt: "What permanent actions were chosen? For each, which D4 cause does it eliminate?"
        type: text
        required: true
      - key: alternatives
        prompt: "What alternatives were considered, and why were they not chosen?"
        type: text
        required: false
      - key: side_effects
        prompt: "Could these actions introduce a new risk elsewhere?"
        type: text
        required: false
    blocks:
      - key: actions
        kind: table
        label: "Permanent corrective actions"
        columns:
          - { key: id,       label: "ID",     type: string }
          - { key: cause_id, label: "Addresses cause", type: string }
          - { key: action,   label: "Action", type: string }
          - { key: owner,    label: "Owner",  type: string }
          - { key: due_at,   label: "Due",    type: date }
        min_rows: 1
      - key: rationale
        kind: prose
        label: "Why these actions were chosen"
    requirements:
      - id: corrective_present
        kind: rows
        block: actions
        min: 1
        severity: blocker
      - id: corrective_owned_and_dated
        kind: fields_filled
        block: actions
        fields: [action, owner, due_at]
        severity: blocker
      - id: corrective_traces_to_cause
        kind: cross_ref
        block: actions
        field: cause_id
        references: d4_root_cause.causes.id
        severity: blocker

  - key: d6_implement
    title: "D6 — Implement and Validate"
    description: "Evidence that the corrective actions were implemented and actually worked."
    guidance: >
      Validation needs a measurement, not an assertion. "Defect no longer
      observed" is only meaningful with a quantity and a period.
    required: true
    depends_on: [d5_corrective]
    uses_images: true
    questions:
      - key: implemented
        prompt: "Which actions are implemented, when, and what evidence shows it?"
        type: text
        required: true
      - key: measured_result
        prompt: "What was measured after implementation — over how many parts or how long?"
        type: text
        required: true
      - key: containment_lifted
        prompt: "Has the interim containment from D3 been lifted?"
        type: boolean
        required: true
    blocks:
      - key: implementation
        kind: table
        label: "Implementation status"
        columns:
          - { key: action_id,      label: "Action", type: string }
          - { key: implemented_at, label: "Implemented", type: date }
          - { key: evidence,       label: "Evidence", type: string }
        min_rows: 1
      - key: validation
        kind: prose
        label: "Validation of effectiveness"
        hint: "Measured result over a defined quantity or period."
      - key: evidence_images
        kind: image_ref
        label: "Validation evidence"
        multiple: true
        required: false
    requirements:
      - id: implementation_complete
        kind: fields_filled
        block: implementation
        fields: [action_id, implemented_at, evidence]
        severity: blocker
      - id: implementation_traces
        kind: cross_ref
        block: implementation
        field: action_id
        references: d5_corrective.actions.id
        severity: blocker
      - id: validation_measured
        kind: mentions
        block: validation
        must_mention:
          - "a measured quantity, rate or period demonstrating effectiveness"
        severity: blocker

  - key: d7_prevent
    title: "D7 — Prevent Recurrence"
    description: >
      Systemic changes stopping the same cause from producing a defect
      elsewhere: FMEA, control plan, work instruction and lessons-learned updates.
    guidance: >
      Ask explicitly whether similar parts, processes or product lines share the
      cause. A D7 that only fixes the one part number usually means the D4 cause
      was described too narrowly.
    required: true
    depends_on: [d4_root_cause, d6_implement]
    questions:
      - key: documents_updated
        prompt: "Which control documents were updated — FMEA, control plan, work instruction, inspection standard?"
        type: text
        required: true
      - key: similar_products
        prompt: "Which other parts, processes or lines share this cause, and what did you find when you checked?"
        type: text
        required: true
      - key: lessons_shared
        prompt: "How was this shared beyond the team?"
        type: text
        required: false
    blocks:
      - key: system_changes
        kind: table
        label: "Systemic changes"
        columns:
          - { key: document, label: "Document / system", type: string }
          - { key: change,   label: "Change made",       type: string }
          - { key: owner,    label: "Owner",             type: string }
          - { key: done_at,  label: "Completed",         type: date }
        min_rows: 1
      - key: horizontal
        kind: prose
        label: "Horizontal deployment"
        hint: "Which other parts, processes or lines were checked, and the outcome."
    requirements:
      - id: prevent_present
        kind: rows
        block: system_changes
        min: 1
        severity: blocker
      - id: prevent_updates_controls
        kind: rubric
        block: system_changes
        rubric: >
          At least one change updates a control document — FMEA, control plan,
          work instruction, or inspection standard.
        severity: blocker
      - id: horizontal_considered
        kind: present
        block: horizontal
        severity: warning

  - key: d8_close
    title: "D8 — Recognise the Team and Close"
    description: "Formal closure, lessons learned, and recognition of the team."
    required: true
    depends_on: [d7_prevent]
    questions:
      - key: what_worked
        prompt: "What worked well in solving this, and what would you do differently?"
        type: text
        required: true
      - key: closed_on
        prompt: "When was the case closed?"
        type: date
        required: true
      - key: approver
        prompt: "Who approved the closure?"
        type: text
        required: true
    blocks:
      - key: lessons
        kind: prose
        label: "Lessons learned"
      - key: closure
        kind: keyvalue
        label: "Closure"
        fields:
          - { key: closed_at,   label: "Date closed",  type: date,   required: true }
          - { key: approved_by, label: "Approved by",  type: string, required: true }
    requirements:
      - id: closure_complete
        kind: present
        block: closure
        severity: blocker
      - id: lessons_present
        kind: present
        block: lessons
        severity: warning

# ---------------------------------------------------------------------------
# Document-level quality criteria — evaluated at the final gate
# ---------------------------------------------------------------------------
quality_criteria:

  - id: root_cause_addressed
    title: "Corrective actions address the root cause"
    severity: blocker
    kind: consistency
    scope: [d4_root_cause, d5_corrective]
    rubric: >
      Every cause listed in D4 is addressed by at least one corrective action in
      D5, and each D5 action plausibly eliminates the cause it claims to address
      rather than merely mitigating its symptom.

  - id: containment_precedes_permanent
    title: "Containment is interim, not permanent"
    severity: warning
    kind: consistency
    scope: [d3_containment, d5_corrective]
    rubric: >
      D3 actions are protective and temporary. If a D3 action appears unchanged
      as the permanent fix in D5, the report has substituted containment for
      correction.

  - id: detection_gap_closed
    title: "The escape is addressed, not only the defect"
    severity: blocker
    kind: consistency
    scope: [d4_root_cause, d5_corrective, d7_prevent]
    rubric: >
      The detection root cause from D4 — what allowed the defect to escape — is
      addressed by an action in D5 or a systemic change in D7.

  - id: no_unsupported_claims
    title: "No unsupported assertions"
    severity: blocker
    kind: rubric
    scope: document
    rubric: >
      The report contains no factual claim — quantity, date, measurement, or
      verification result — that is not supported by the evidence supplied or by
      an explicit statement from the creator.

  - id: customer_readable
    title: "Readable by the customer"
    severity: warning
    kind: rubric
    scope: document
    rubric: >
      The report is understandable to a quality engineer at the customer with no
      knowledge of internal plant shorthand. Internal abbreviations, machine
      nicknames and system names are explained on first use.

  - id: timeline_coherent
    title: "Timeline is coherent"
    severity: blocker
    kind: consistency
    scope: [header, d3_containment, d6_implement, d8_close]
    rubric: >
      Dates progress sensibly: the report opens before containment, containment
      precedes implementation, implementation precedes closure.
