# milestone is walking a document end to end with NO model involved, and this file
# is what stands in for one.

document_title: "4D — Cracked weld seam, bracket A-4471"

sections:

  header:
    answers:
      complaint_source: customer_claim
    blocks:
      meta:
        report_no: "4D-2026-0143"
        customer: "Nordwerk Fahrzeugtechnik GmbH"
        claim_no: "NW-CL-88213"
        part_no: "A-4471"
        part_name: "Mounting bracket, rear axle"
